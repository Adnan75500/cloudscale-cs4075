<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Campus Lost &amp; Found</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: .5rem; }
    .card img { width: 100%; height: 140px; object-fit: cover; }
    input, textarea, select { width: 100%; margin: .25rem 0 .75rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a> | <a href="/new">Post an item</a> |
    {% if user %}{{ user.email }} <a href="/logout">Logout</a>{% else %}<a href="/login">Login</a>{% endif %}
  </nav>
  <hr>
  {% block body %}{% endblock %}
</body>
</html>
